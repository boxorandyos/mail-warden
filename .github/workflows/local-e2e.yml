name: Local Stack E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "deployments/docker/**"
      - "tests/integration/run-local-stack-e2e.sh"

jobs:
  local-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start and validate local stack
        run: ./tests/integration/run-local-stack-e2e.sh
